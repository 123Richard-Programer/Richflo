<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple profile card</title>
  <link rel="stylesheet" href="./css//style.css">

</head>

<body>

  <div class="container">
    <div class="image-container">
      <img src="/image/my-photo.jpeg" alt="Profile">
    </div>

    <div class="details">
      <h1>Richard F-J Kamara</h1>
      <p>Fullstack Developer</p>
    </div>
    <div class="buttons-container">
      <button>Follow</button>
      <button>50K Followers</button>
      <button>100K likes</button>
    </div>
    <div></div>
  </div>

</body>

</html>
